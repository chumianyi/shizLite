name: Build shizLite Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias shizlite \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass shizlite2026 \
            -keypass shizlite2026 \
            -dname "CN=shizLite, OU=Chumian, O=Chumian, L=Shanghai, ST=Shanghai, C=CN"

      - name: Sign APK
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks release.keystore \
            --ks-key-alias shizlite \
            --ks-pass pass:shizlite2026 \
            --key-pass pass:shizlite2026 \
            --out app/build/outputs/apk/release/shizLite-v1.0.0-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk || \
          $ANDROID_HOME/build-tools/33.0.1/apksigner sign \
            --ks release.keystore \
            --ks-key-alias shizlite \
            --ks-pass pass:shizlite2026 \
            --key-pass pass:shizlite2026 \
            --out app/build/outputs/apk/release/shizLite-v1.0.0-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verify APK signature
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose app/build/outputs/apk/release/shizLite-v1.0.0-release.apk || \
          $ANDROID_HOME/build-tools/33.0.1/apksigner verify --verbose app/build/outputs/apk/release/shizLite-v1.0.0-release.apk || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shizLite-v1.0.0-release
          path: app/build/outputs/apk/release/shizLite-v1.0.0-release.apk
          retention-days: 30
