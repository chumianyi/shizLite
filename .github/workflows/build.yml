name: Build shizLite Release APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Generate debug keystore
        run: |
          mkdir -p ~/.config/.android ~/.android
          keytool -genkeypair -v -keystore ~/.config/.android/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          cp ~/.config/.android/debug.keystore ~/.android/debug.keystore
      - name: Build Release APK
        run: ./gradlew :manager:assembleRelease --no-daemon --stacktrace

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias shizlite \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass shizlite2026 -keypass shizlite2026 \
            -dname "CN=shizLite, OU=Chumian, O=Chumian, L=Shanghai, ST=Shanghai, C=CN"

      - name: Sign APK
        run: |
          APK=$(find manager/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK found: $APK"
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks release.keystore --ks-key-alias shizlite \
            --ks-pass pass:shizlite2026 --key-pass pass:shizlite2026 \
            --out shizLite-release.apk "$APK" || \
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks release.keystore --ks-key-alias shizlite \
            --ks-pass pass:shizlite2026 --key-pass pass:shizlite2026 \
            --out shizLite-release.apk "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shizLite-release
          path: shizLite-release.apk
          retention-days: 30
